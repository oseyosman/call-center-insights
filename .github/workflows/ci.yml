name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite (non-slow tests only)
        run: |
          pytest -m "not slow" -q

      - name: Run Baseline Quality Gate (absolute thresholds)
        run: |
          python -m evals.run_eval \
            --provider baseline \
            --split dev \
            --no-audio \
            --out-json evals/results/ci_dev.json \
            --out-md  evals/results/ci_dev.md \
            --min-sentiment-start-acc 45.0 \
            --min-sentiment-end-acc 50.0 \
            --min-resolution-acc 60.0 \
            --min-grounding-rate 95.0 \
            --max-resolution-time-mae 0.50 \
            --baseline-json evals/results/baseline_v0.json \
            --max-acc-drop 5.0 \
            --max-mae-increase 0.1
