[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "call-center-insights"
version = "0.1.0"
description = "Local call-center audio insights pipeline: transcription, PII redaction, LLM extraction, and resolution reporting."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Portfolio Project" }
]
dependencies = [
    "faster-whisper>=1.0.0",
    "pydantic>=2.5.0",
    "vaderSentiment>=3.3.2",
    "requests>=2.31.0",
    "anthropic>=0.34.0",
    "streamlit>=1.30.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "jiwer>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0,<19.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["callinsight*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

